name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so that the GitHub activity heatmap stays current.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  # write: the scheduled run commits the regenerated heatmap (see below).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Regenerates images/github-activity.svg, assets/github-activity.json and the
      # block in index.html. When the API call fails, the script changes no file,
      # so the committed versions are deployed.
      - name: Update GitHub activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-activity.mjs
      # GitHub disables scheduled workflows in a public repository after 60 days
      # without repository activity. Committing the regenerated heatmap on the
      # scheduled and manual runs keeps the repository active. A push made with
      # GITHUB_TOKEN does not start another workflow run, so this cannot loop.
      - name: Commit the updated GitHub activity
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git add images/github-activity.svg assets/github-activity.json index.html
          if git diff --cached --quiet; then
            echo "No change in the GitHub activity."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update GitHub activity ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
